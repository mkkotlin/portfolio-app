<div class="min-h-screen bg-[#070a12] text-slate-100 font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
  
  <!-- Navigation Header -->
  <app-navbar (openResume)="openResumeModal()"></app-navbar>

  <!-- Main Content Sections -->
  <main>
    <app-hero (openResume)="openResumeModal()"></app-hero>
    <app-experience></app-experience>
    <app-projects></app-projects>
    <app-tech-stack></app-tech-stack>
    <app-dsa></app-dsa>
    <app-concepts></app-concepts>
    <app-timeline></app-timeline>
    <app-contact></app-contact>
  </main>

  <!-- Interactive Resume Modal -->
  <app-resume-modal 
    [isOpen]="isResumeModalOpen" 
    (close)="closeResumeModal()"
  ></app-resume-modal>

</div>
